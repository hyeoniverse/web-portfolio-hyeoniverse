name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  check:
    name: typecheck / lint / test / audit
    runs-on: ubuntu-latest
    # npm ci 가 ~/.npm 캐시를 맞히면 20초, 놓치면 7분이다(node_modules 1.2GB).
    # 10분으로는 캐시 미스 한 번에 검사 단계가 통째로 잘려 나가 master 에서도 간헐적으로 취소됐다.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # --prefer-offline: 캐시에 있으면 레지스트리를 다시 묻지 않는다.
      # --no-audit --no-fund: CI 에서 쓰지 않는 메타데이터 왕복을 줄인다.
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: TypeScript typecheck
        run: npm run typecheck

      # warning 총량이 락돼 있다 (--max-warnings). 한 개라도 늘면 실패한다.
      # 줄였다면 package.json 의 상한도 함께 내려 되돌아가지 못하게 한다.
      - name: ESLint (warning 총량 락)
        run: npm run lint

      - name: Stylelint (CSS token compliance)
        run: npm run lint:css

      - name: Unit tests
        run: npm test

      # 미사용 export·파일은 아직 보조 신호다 — 78개가 남아 있어 슬라이스별로 정리 중이라
      # 리포트만 남기고 CI 를 세우지 않는다.
      - name: Knip 리포트 (미사용 export·파일)
        run: npm run knip -- --no-exit-code
        continue-on-error: true

      # 선언되지 않은 의존성만 차단한다 (#687 5-7).
      # package.json 에 없는 패키지를 import 해도 다른 패키지에 딸려 와 있으면 로컬에선 돌아간다.
      # 그 패키지가 의존성을 바꾸는 순간 깨끗한 설치에서 빌드가 죽는다 — 실제로 CodeMirror
      # 언어 모드 4개가 sandpack 에 얹혀 그 상태였다. 지금은 0건이라 락을 건다.
      - name: Knip 게이트 (미등록 의존성 0)
        run: npm run knip:deps

      # 임계치를 현재 수준(97.93%)에 붙여 락했으므로 차단으로 승격한다.
      # 올렸다면 package.json 의 --at-least 도 함께 올려 되돌아가지 못하게 한다.
      #
      # 실패했을 때 어디가 any 인지는 로컬에서 본다 — CI 에 --detail 을 켜두면
      # any 위치 수천 줄이 매번 출력돼 로그를 덮고 실행 시간도 크게 늘어난다.
      #   npx type-coverage --strict --ignore-files ".next/**" --detail
      - name: type-coverage (97.93% 락)
        run: npm run type-coverage
