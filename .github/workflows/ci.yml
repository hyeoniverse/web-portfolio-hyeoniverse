name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  check:
    name: typecheck / lint / test / audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      # warning 총량이 락돼 있다 (--max-warnings). 한 개라도 늘면 실패한다.
      # 줄였다면 package.json 의 상한도 함께 내려 되돌아가지 못하게 한다.
      - name: ESLint (warning 총량 락)
        run: npm run lint

      - name: Stylelint (CSS token compliance)
        run: npm run lint:css

      - name: Unit tests
        run: npm test

      # Knip 은 아직 보조 신호 — 미사용 export 57개가 남아 있어 슬라이스별로 정리 중이다.
      # 선언되지 않은 의존성(#373) 이 정리되면 차단으로 승격한다.
      - name: Knip (unused exports / files / deps)
        run: npx knip --no-exit-code
        continue-on-error: true

      # 임계치를 현재 수준(97.7%)에 붙여 락했으므로 차단으로 승격한다.
      # 올렸다면 package.json 의 --at-least 도 함께 올려 되돌아가지 못하게 한다.
      #
      # --detail 은 any 로 잡힌 위치를 전부 쏟아내 정작 마지막 요약(%)이 로그에서 잘린다.
      # 실패 원인을 못 읽으므로, 먼저 요약만 찍고 그 다음 상세를 낸다.
      - name: type-coverage (97.7% 락)
        run: |
          echo "── 요약 ──"
          npx type-coverage --strict || true
          echo "── 임계치 검사 ──"
          npm run type-coverage
