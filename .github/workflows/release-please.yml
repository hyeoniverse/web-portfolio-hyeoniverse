name: Release Please

on:
  push:
    branches: [master, main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          # Conventional Commits 기반으로 자동 version bump + CHANGELOG.md + release PR 생성
          release-type: node
          package-name: web-portfolio-arc
          # PR 작성자를 본인 명의로 — WORKFLOW_PAT secret 에 PAT 등록 (claude.yml 과 공용)
          # 미설정 시 GITHUB_TOKEN (github-actions bot) 사용
          token: ${{ secrets.WORKFLOW_PAT || secrets.GITHUB_TOKEN }}
