name: Weekly Audit

# 매주 월요일 09:00 KST (UTC 00:00) — unused / type-coverage / outdated 결과를 issue 로 자동 생성
on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch: # 수동 트리거 가능

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run knip
        id: knip
        run: |
          echo '## Knip — unused exports / files / dependencies' > report.md
          echo '' >> report.md
          echo '```' >> report.md
          npx knip --no-exit-code >> report.md 2>&1 || true
          echo '```' >> report.md
          echo '' >> report.md

      - name: Run type-coverage
        run: |
          echo '## Type Coverage' >> report.md
          echo '' >> report.md
          echo '```' >> report.md
          npx type-coverage --strict >> report.md 2>&1 || true
          echo '```' >> report.md
          echo '' >> report.md

      - name: Outdated packages
        run: |
          echo '## npm outdated' >> report.md
          echo '' >> report.md
          echo '```' >> report.md
          npm outdated >> report.md 2>&1 || true
          echo '```' >> report.md

      - name: Create / update audit issue
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('report.md', 'utf8');
            const title = `Weekly Audit — ${new Date().toISOString().slice(0, 10)}`;

            // 같은 주의 issue 가 이미 있으면 update, 없으면 create
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'audit',
              per_page: 5,
            });
            const sameWeek = existing.find(i => i.title === title);
            if (sameWeek) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: sameWeek.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['audit'],
              });
            }
