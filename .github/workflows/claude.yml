name: Claude Code

# 사용 방법:
#   1. PR 열거나 push 하면 → 자동으로 Claude 가 코드 리뷰 댓글 작성 (draft PR 은 skip)
#   2. Issue / PR comment 에 "@claude <지시>" 멘션 → Claude 가 브랜치 만들고 코드 작성 후 PR 생성
#      예시:
#        "@claude usePortalMount 헬퍼 추출해서 Modal / Tooltip 두 컴포넌트에 적용"
#        "@claude /api/admin/* 라우트 중 requireAuth() 없는 곳 찾아서 추가"
#   3. PR review comment 에 "@claude <피드백>" → 해당 PR 의 브랜치에 추가 커밋
#
# 필요한 GitHub Secrets:
#   CLAUDE_CODE_OAUTH_TOKEN — `claude setup-token` 로 발급 (Pro/Max 구독에 묶임, 무료)
#   WORKFLOW_PAT            — Personal Access Token (repo + workflow scope). PR 작성자를 본인 명의로 만들기 위함.
#                             https://github.com/settings/tokens 에서 "Fine-grained personal access token"
#                             repository permissions: Contents (read/write), Pull requests (read/write), Issues (read/write)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    # dependabot PR 은 skip — GitHub 보안 정책상 dependabot 트리거 워크플로우는
    # repo secrets (WORKFLOW_PAT) 접근 불가 → checkout 실패. dependabot PR 은
    # CI 만으로 충분히 검증됨 (코드 리뷰의 가치도 낮음).
    # pull_request 는 항상 실행 (draft 제외), 나머지는 @claude 멘션 있을 때만
    if: |
      github.actor != 'dependabot[bot]' && (
        (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # PR 작성자가 본인이 되도록 PAT 사용 (GITHUB_TOKEN 이면 github-actions[bot] 작성)
          token: ${{ secrets.WORKFLOW_PAT }}
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1.0.183
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Claude 가 git 작업 시 본인 이름으로 commit 하도록
          # (PAT 와 함께 동작 — push 시점에 PAT 의 GitHub 계정이 PR 작성자로 들어감)
          github_token: ${{ secrets.WORKFLOW_PAT }}
