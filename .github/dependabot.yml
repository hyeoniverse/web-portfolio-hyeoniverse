version: 2
updates:
  # npm 패키지 — 매주 월요일 1회, 최대 5개 PR 동시 오픈
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      # patch + minor 자잘한 업데이트는 한 PR 에 묶어 줄이기
      minor-and-patch:
        update-types:
          - minor
          - patch
      # platejs 생태계는 peer dep 으로 묶여 있어 메이저도 한 번에 올려야 함
      # (개별 PR 로는 ERESOLVE 충돌)
      platejs:
        patterns:
          - "platejs"
          - "@platejs/*"
        update-types:
          - major
          - minor
          - patch
    # 메이저 버전 업데이트 무시 항목 (수동 검토 후 처리)
    ignore:
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      # react 19.3+ — @react-three/fiber(최신 9.7.0)의 peer 가 react ">=19 <19.3" 이라
      # 19.3 으로 올리면 npm install 이 ERESOLVE 로 실패한다 (Vercel 배포 실패로 발견).
      # fiber 는 reconciler 를 내장해 React 버전에 실제로 묶여 있다 — 19.3 에서 useTransition 이
      # R3F 트리 안에서 throw 하는 이슈 (pmndrs/react-three-fiber#3915). 19.2.x 패치는 계속 받도록
      # minor+major 만 무시. fiber 가 19.3 을 지원하면 해제하고 package.json 의 ~19.2.8 도 ^ 로 되돌린다.
      - dependency-name: "react"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # eslint 10 — eslint-config-next + typescript-eslint peer dep 미지원.
      # 향후 `next lint` 제거하고 eslint CLI 직접 사용으로 migration 후 해제.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # typescript 7 — typescript-eslint(eslint-config-next 경유)가 아직 미지원.
      # tsc 는 통과하지만 ESLint 단계가 "does not support TS 7.0" 로 실패한다.
      # typescript-eslint 가 TS7 을 지원하면 해제.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # katex 0.18+ — marked-katex-extension(최신 5.1.10)의 peer 가 katex ">=0.16 <0.18"
      # 라 0.18 로 올리면 npm ci 가 ERESOLVE 로 실패한다 (매주 재발: #351 → #363).
      # 0.17.x 패치는 계속 받도록 minor+major 만 무시. marked-katex-extension 이 0.18 지원하면 해제.
      - dependency-name: "katex"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # jsdom 30+ — Node 20 지원을 끊음 (요구: ^22.22.2 || ^24.15.0 || >=26.0.0).
      # 테스트 전용 dev dep 하나 때문에 Node 베이스라인을 22+ 로 올리는 건 과해서 major 는 무시.
      # 29.x 패치/마이너는 계속 받는다. 프로젝트를 Node 22+ 로 이전하면 해제. (#526)
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]

  # GitHub Actions — 매월 1회
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
