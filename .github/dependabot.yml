version: 2
updates:
  # npm 패키지 — 매주 월요일 1회, 최대 5개 PR 동시 오픈
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      # patch + minor 자잘한 업데이트는 한 PR 에 묶어 줄이기
      minor-and-patch:
        update-types:
          - minor
          - patch
      # platejs 생태계는 peer dep 으로 묶여 있어 메이저도 한 번에 올려야 함
      # (개별 PR 로는 ERESOLVE 충돌)
      platejs:
        patterns:
          - "platejs"
          - "@platejs/*"
        update-types:
          - major
          - minor
          - patch
    # 메이저 버전 업데이트 무시 항목 (수동 검토 후 처리)
    ignore:
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  # GitHub Actions — 매월 1회
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
